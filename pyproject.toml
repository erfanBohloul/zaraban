[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zaraban"
version = "0.1.0"
description = "Automated Security Patch Validation and Regression Testing Tool for CI/CD"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Zaraban Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pyelftools>=0.29",
    "unidiff>=0.7.5",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
zaraban = "zaraban.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zaraban*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
