  expected_exit_code: 0
  expected_output: |2+

  output_match: exact
- name: minify_line_comment_at_end
  description: 'Input ends right after the construct; prints ''{}''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
  args:
  - minify
  - '{input_file}'
  input_file: tests/boundary/minify_line_comment_at_end.json
  expected_exit_code: 0
  expected_output: |
    {}
  output_match: exact
- name: minify_comment_then_string
  description: 'Input ends right after the construct; prints ''"a"''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
  args:
  - minify
  - '{input_file}'
