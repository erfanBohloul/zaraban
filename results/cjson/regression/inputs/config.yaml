# cJSON target (DaveGamble/cJSON v1.7.10), CVE-2019-11834 and CVE-2019-11835.
# Where every expected behavior comes from: ORACLE.md.

name: cjson
input_method: file
build:
  binary_path: cjson_driver
  release_cmd: make release
  sanitized_cmd: make sanitized
  clean_cmd: make clean
  coverage_cmd: make coverage
limits:
  timeout_seconds: 2.0
  memory_limit_mb: 256
valid_tests:
- name: minify_spaces
  description: 'cjson_minify_should_remove_spaces: prints {"key":true}. Source: upstream tests/minify_tests.c
    (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_spaces.json
  expected_exit_code: 0
  expected_output: |
    {"key":true}
  output_match: exact
- name: minify_line_comment
  description: 'cjson_minify_should_remove_single_line_comments: prints {}. Source: upstream tests/minify_tests.c
    (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_line_comment.json
  expected_exit_code: 0
  expected_output: |
    {}
  output_match: exact
- name: minify_multiline_comment
  description: 'cjson_minify_should_remove_multiline_comments: prints {}. Source: upstream tests/minify_tests.c
    (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_multiline_comment.json
  expected_exit_code: 0
  expected_output: |
    {}
  output_match: exact
- name: minify_keeps_strings
  description: 'cjson_minify_should_not_modify_strings: a string is printed unchanged. Source: upstream
    tests/minify_tests.c (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_keeps_strings.json
  expected_exit_code: 0
  expected_output: |
    "this is a string \" \t bla"
  output_match: exact
- name: minify_glossary
  description: 'cjson_minify_should_minify_json: whitespace and both comment kinds removed. Source: upstream
    tests/minify_tests.c (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_glossary.json
  expected_exit_code: 0
  expected_output: |
    {"glossary":{"title":"example glossary","GlossDiv":{"title":"S","GlossList":{"GlossEntry":{"ID":"SGML","SortAs":"SGML","Acronym":"SGML","Abbrev":"ISO 8879:1986","GlossDef":{"GlossSeeAlso":["GML","XML"]},"GlossSee":"markup"}}}}}
  output_match: exact
- name: minify_comment_marks_in_string
  description: 'Strings are not modified, so the output equals the input. Source: RFC 8259 §7 (''/'' and
    ''*'' are ordinary string characters) and cjson_minify_should_not_modify_strings in upstream tests/minify_tests.c
    (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_comment_marks_in_string.json
  expected_exit_code: 0
  expected_output: |
    {"pattern":"/*"}
  output_match: exact
- name: minify_glob_in_string
  description: 'Strings are not modified, so the output equals the input. Source: RFC 8259 §7 (''/'' and
    ''*'' are ordinary string characters) and cjson_minify_should_not_modify_strings in upstream tests/minify_tests.c
    (v1.7.12)'
  args:
  - minify
  - '{input_file}'
  input_file: tests/valid/minify_glob_in_string.json
  expected_exit_code: 0
  expected_output: |
    {"include":"src/*.c","exclude":"*/tmp"}
  output_match: exact
- name: parse_test1
  description: 'Parsed and printed with cJSON_Print, byte for byte as tests/inputs/test1.expected. Source:
    upstream tests/parse_examples.c (v1.7.10)'
  args:
