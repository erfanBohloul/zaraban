boundary_tests:
- name: minify_empty
  description: 'Input ends right after the construct; prints ''''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
  args:
  - minify
  - '{input_file}'
  input_file: tests/boundary/minify_empty.json
  expected_exit_code: 0
  expected_output: |2+

  output_match: exact
- name: minify_only_whitespace
  description: 'Input ends right after the construct; prints ''''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
  args:
  - minify
  - '{input_file}'
  input_file: tests/boundary/minify_only_whitespace.json
  expected_exit_code: 0
  expected_output: |2+

  output_match: exact
- name: minify_comment_closed_at_end
  description: 'Input ends right after the construct; prints ''{}''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
  args:
  - minify
  - '{input_file}'
  input_file: tests/boundary/minify_comment_closed_at_end.json
  expected_exit_code: 0
  expected_output: |
    {}
  output_match: exact
- name: minify_empty_comment
  description: 'Input ends right after the construct; prints ''''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
