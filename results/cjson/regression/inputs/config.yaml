- name: minify_string_at_end
  description: 'Input ends right after the construct; prints ''"abc"''. Source: cJSON_Minify removes whitespace
    and comments and keeps strings (cJSON.h doc comment; upstream tests/minify_tests.c (v1.7.12))'
  args:
  - minify
  - '{input_file}'
  input_file: tests/boundary/minify_string_at_end.json
  expected_exit_code: 0
  expected_output: |
